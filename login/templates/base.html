<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- タイトルブロックを定義 -->
  <title>
    {% block title %}
    <!-- ここにタイトルを表示 -->
    {% endblock %}
  </title>
</head>

<body>
  <header>
    <h1>
      <!-- ヘッダーブロックを定義 -->
      {% block header %}
      <!-- ここにヘッダーを表示 -->
      {% endblock %}
    </h1>
    <!-- 各画面へのメニュー -->
    <nav>
      <ul>
        <li>
          <!-- / にアクセスするURLを作成 -->
          <a href="{{url_for('index')}}">トップページ</a>
        </li>
        <!-- ログインしている場合のみ表示-->
        {% if login_user_name %}
        <li>
          <!-- /write にアクセスするURLを作成 -->
          <a href="{{url_for('write')}}">書き込みページ</a>
        </li>
        <li>
          <!-- /logoutにアクセスするURLを作成-->
          <a href="{{url_for('logout')}}">ログアウト</a>
        </li>
        {% endif %}
        <!-- ログインしていない場合のみ表示-->
        {% if not login_user_name %}
        <li>
          <!-- /signupのアクセスするURLを作成-->
          <a href="{{url_for('signup')}}">アカウント登録ページ</a>
        </li>
        <li>
          <!-- /loginにアクセスするURLを作成-->
          <a href="{{url_for('login')}}">ログインページ</a>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main>
    <!-- コンテンツブロックを定義 -->
    {% block contents %}
    <!-- ここにコンテンツを表示 -->
    <!-- デフォルトで「まだ何もコンテンツがありません」-->
    まだ何もコンテンツがありません。
    {% endblock %}
  </main>
</body>

</html>
