<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Bootstrapの読み込み -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- カスタムCSSもここに書ける -->
  <style>
    body {
      background-color: #f4f6f8;
    }
    .navbar {
      margin-bottom: 30px;
    }
    .card {
      margin-bottom: 20px;
    }
    .container {
      max-width: 800px;
    }
  </style>

  <title>
    {% block title %}
    みゃん掲示板
    {% endblock %}
  </title>
</head>

<body>
  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">🐾 MyanBoard</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">トップ</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('write') }}">書き込み</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="container">
    {% block header %}
    <!-- ヘッダー（必要ならここでタイトルなどを表示） -->
    {% endblock %}

    {% block contents %}
    <!-- コンテンツがここに入る -->
    まだ何もコンテンツがありません。
    {% endblock %}
  </main>

  <!-- BootstrapのJS（必要なら） -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
