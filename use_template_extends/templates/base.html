<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- タイトルブロックを定義-->
  <title>
    {% block title %}
    <!-- ここにタイトルを表示 -->
    {% endblock %}
  </title>
</head>

<body>
  <header>
    <h1>
      <!-- ヘッダーブロックを定義 -->
      {% block header %}
      <!-- ここにヘッダーを表示 -->
      {% endblock %}
    </h1>
    <!-- 各画面へのメニュー -->
    <nav>
      <ul>
        <li>
          <!-- / にアクセスするURLを作成 -->
          <a href="{{url_for('index')}}">トップページ</a>
        </li>
        <li>
          <!-- /write にアクセスするURLを作成 -->
          <a href="{{url_for('write')}}">書き込みページ</a>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    {% block contents %}
    <!-- ここにコンテンツを表示 -->
    まだ何もコンテンツがありません。
    {% endblock %}
  </main>
</body>
</html>
